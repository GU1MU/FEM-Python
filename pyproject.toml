[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-project"
version = "0.1.0"
description = "Finite element modeling tutorial project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3,<3",
    "py-mkl-pardiso>=0.0.5,<0.1",
    "scipy>=1.16,<2",
]

[project.gui-scripts]
fem-gui = "fem_gui.app:main"

[project.optional-dependencies]
cad = [
    "gmsh>=4.15.2,<5",
]
agent = [
    "httpx[socks]>=0.28,<1",
    "openai>=2.46,<3",
]
gui = [
    "PySide6>=6.8,<7",
    "pyvista>=0.46,<1",
    "pyvistaqt>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fem_gui = ["resources/icons/*.png", "resources/icons/*.svg"]

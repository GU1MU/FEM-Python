[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-project"
version = "0.1.0"
description = "Finite element modeling tutorial project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3,<3",
    "scipy>=1.16,<2",
]

[project.scripts]
fem-agent = "fem_agent.cli:main"
fem-gui = "fem_gui.app:main"

[project.optional-dependencies]
cad = [
    "gmsh>=4.15.2,<5",
]
agent = [
    "httpx[socks]>=0.28,<1",
    "openai>=2.46,<3",
    "prompt-toolkit>=3.0.52,<4",
]
test = [
    "httpx[socks]>=0.28,<1",
    "openai>=2.46,<3",
    "prompt-toolkit>=3.0.52,<4",
    "PySide6>=6.8,<7",
    "pytest>=9,<10",
    "pyvista>=0.46,<1",
    "pyvistaqt>=0.11,<1",
]
gui = [
    "PySide6>=6.8,<7",
    "pyvista>=0.46,<1",
    "pyvistaqt>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fem_gui = ["resources/icons/*.png", "resources/icons/combo_down_arrow.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --strict-markers"
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2\\.5\\.:DeprecationWarning:vtkmodules\\.util\\.numpy_support$",
]
markers = [
    "integration: tests that cross package or external-runtime boundaries",
    "gmsh: tests that require the optional native Gmsh runtime",
    "slow: tests gated by the slow-opt-in contract",
    "cloud: tests gated by the cloud-opt-in contract",
    "platform: tests gated by a platform capability",
    "optional_runtime: tests gated by an optional native runtime",
]

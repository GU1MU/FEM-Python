[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-project"
version = "0.1.0"
description = "Finite element modeling tutorial project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3,<3",
    "scipy>=1.16,<2",
]

[project.optional-dependencies]
cad = [
    "gmsh>=4.15.2,<5",
]
test = [
    "pytest>=9",
]
gui = [
    "PySide6>=6.8,<7",
    "pyvista>=0.46,<1",
    "pyvistaqt>=0.11,<1",
]

[project.scripts]
fem-gui = "fem_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fem_gui = ["resources/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "slow: opt-in performance and scalability tests",
]

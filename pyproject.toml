[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fem-project"
version = "0.1.0"
description = "Finite element modeling tutorial project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3,<3",
    "scipy>=1.16,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
